<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#073f32">
  <title>Vila Cash · Central de acesso</title>
  <link rel="icon" href="assets/vila-cash-icon.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap');
    :root{--g:#073f32;--o:#f27b18;--ink:#12352d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Manrope,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,rgba(159,206,52,.32),transparent 28%),radial-gradient(circle at 88% 18%,rgba(242,123,24,.3),transparent 27%),linear-gradient(145deg,#eef7ed,#fff4e7 50%,#edf6f2)}
    .wrap{width:min(470px,100%);padding:22px}
    .glass{background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.82);box-shadow:0 20px 55px rgba(7,63,50,.15);backdrop-filter:blur(22px);border-radius:25px}
    header{text-align:center;padding:28px 22px 18px}
    .icon{width:92px;height:92px;border-radius:23px;box-shadow:0 14px 32px rgba(7,63,50,.2)}
    h1{margin:12px 0 4px;color:var(--g);font-size:28px}
    .sub{font-size:13px;opacity:.68}
    .links{padding:10px 18px 22px;display:grid;gap:11px}
    a{display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:16px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.63);border:1px solid rgba(255,255,255,.85);transition:.15s}
    a:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(7,63,50,.1)}
    .bubble{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:rgba(7,63,50,.1);font-size:20px}
    a:first-child .bubble{background:rgba(242,123,24,.14)}
    .name{font-weight:800;color:var(--g)}
    small{display:block;margin-top:2px;opacity:.62}
    .arrow{margin-left:auto;font-size:22px;color:var(--o)}
    footer{text-align:center;font-size:10px;opacity:.55;margin-top:14px}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="glass">
      <header>
        <img class="icon" src="assets/vila-cash-192.png" alt="Vila Cash">
        <h1>Vila Cash</h1>
        <div class="sub">Escolha como deseja acessar</div>
      </header>
      <div class="links">
        <a href="cliente/app.html">
          <span class="bubble">◉</span>
          <span><span class="name">Cliente</span><small>Consultar saldo e registrar compra</small></span>
          <span class="arrow">›</span>
        </a>
        <a href="operador/">
          <span class="bubble">▣</span>
          <span><span class="name">Operador</span><small>Acesso da equipe e resgates</small></span>
          <span class="arrow">›</span>
        </a>
        <a href="gestao/">
          <span class="bubble">◆</span>
          <span><span class="name">Gestão</span><small>Indicadores e acompanhamento</small></span>
          <span class="arrow">›</span>
        </a>
      </div>
    </section>
    <footer>Vila Fit · Vila Gourmet</footer>
  </main>
</body>
</html>
