<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vila Cash · Operador</title><style>@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap');:root{--g:#073f32;--o:#f27b18;--ink:#12352d}*{box-sizing:border-box}body{margin:0;font-family:Manrope,sans-serif;color:var(--ink);min-height:100vh;background:radial-gradient(circle at 12% 10%,rgba(159,206,52,.3),transparent 25%),radial-gradient(circle at 88% 15%,rgba(246,139,34,.28),transparent 23%),linear-gradient(145deg,#eef7ed,#fff4e7 50%,#edf6f2)}.wrap{max-width:850px;margin:auto;padding:20px}.glass{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.78);box-shadow:0 18px 50px rgba(7,63,50,.13);backdrop-filter:blur(22px);border-radius:22px}.head{display:flex;align-items:center;gap:9px;padding:11px 13px;margin-bottom:14px}.logo{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.75);overflow:hidden}.logo.g{width:42px;height:42px;border-radius:50%}.logo.f{width:70px;height:42px;border-radius:13px;padding:3px 5px}.logo img{width:100%;height:100%;object-fit:contain}.brand{font-weight:800;color:var(--g);font-size:19px}.card{padding:20px;margin-bottom:14px}h2{margin:0 0 12px;font-size:17px;color:var(--g)}label{display:block;font-size:12px;font-weight:700;margin:9px 0 5px}input{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.58);font:inherit}button{padding:12px 14px;border:0;border-radius:12px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#f27b18,#ff982d);color:#fff}.secondary{background:rgba(255,255,255,.55);color:var(--g);border:1px solid rgba(255,255,255,.8)}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;background:rgba(255,255,255,.55)}.error{color:#a43c2b}.ok{color:#23764e}.cliente{padding:12px;border-radius:14px;background:rgba(255,255,255,.5);display:flex;justify-content:space-between}.login{max-width:420px;margin:12vh auto;padding:25px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div id="loginBox" class="glass login"><h2>Acesso da equipe</h2><label>E-mail</label><input id="email" type="email"><label>Senha</label><input id="senha" type="password"><button style="width:100%;margin-top:13px" onclick="entrar()">Entrar</button><div id="loginMsg"></div></div><main id="app" class="hidden"><header class="glass head"><div class="logo g"><img src="../assets/logo-vila-gourmet.webp"></div><div class="logo f"><img src="../assets/logo-vila-fit.webp"></div><div class="brand">Vila Cash · Operador</div><div style="margin-left:auto"><button class="secondary" onclick="sair()">Sair</button></div></header><section class="glass card"><h2>Localizar cliente</h2><div style="display:flex;gap:8px"><input id="tel" placeholder="Telefone do cliente" inputmode="numeric"><button onclick="buscar()">Buscar</button></div><div id="cliente"></div></section><div id="ops" class="hidden grid"><section class="glass card"><h2>Registrar compra</h2><label>Valor da compra</label><input id="valorCompra" type="number" step="0.01"><label>Operador</label><input id="opCompra" placeholder="Nome do atendente"><button style="width:100%;margin-top:12px" onclick="comprar()">Gerar cashback</button><div id="msgCompra"></div></section><section class="glass card"><h2>Usar cashback</h2><label>Valor da compra</label><input id="valorResgateCompra" type="number" step="0.01" oninput="limite()"><div id="limiteInfo" class="msg"></div><label>Valor a usar</label><input id="valorResgate" type="number" step="0.01"><label>PIN do cliente</label><input id="pinCliente" maxlength="4" type="password" inputmode="numeric"><label>Operador</label><input id="opResgate"><button style="width:100%;margin-top:12px" onclick="resgatar()">Aplicar cashback</button><div id="msgResgate"></div></section></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://bbhtrxuaumhpqtbcgewc.supabase.co','sb_publishable_VO0CBuxqDHhk3n5IwcFjBA_cDwfq0JK');let c=null;const dig=s=>(s||'').replace(/\D/g,'');const money=v=>'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2});async function entrar(){let{error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:senha.value});if(error)return loginMsg.innerHTML='<div class="msg error">E-mail ou senha inválidos.</div>';gate()}async function gate(){let{data:{session}}=await sb.auth.getSession();if(!session)return;let{data,error}=await sb.rpc('vc_staff_status');if(error||!data?.[0]?.autorizado){await sb.auth.signOut();return loginMsg.innerHTML='<div class="msg error">Usuário sem autorização Vila Cash.</div>'}loginBox.classList.add('hidden');app.classList.remove('hidden')}async function sair(){await sb.auth.signOut();location.reload()}async function buscar(){let{data,error}=await sb.rpc('vc_operador_buscar_cliente',{p_telefone:dig(tel.value)});if(error||!data?.length){cliente.innerHTML='<div class="msg error">Cliente não encontrado.</div>';ops.classList.add('hidden');return}c=data[0];cliente.innerHTML='<div class="cliente"><b>'+c.nome+'</b><b>'+money(c.saldo_atual)+'</b></div>';ops.classList.remove('hidden')}async function comprar(){let v=Number(valorCompra.value);if(!c||v<=0)return;let{data,error}=await sb.rpc('vc_registrar_compra',{p_cliente_id:c.id,p_valor_compra:v,p_operador:opCompra.value.trim()||'Caixa'});msgCompra.innerHTML=error?'<div class="msg error">'+error.message+'</div>':'<div class="msg ok">Cashback: '+money(data[0].cashback_creditado)+' · novo saldo '+money(data[0].novo_saldo)+'</div>';buscar()}async function limite(){let v=Number(valorResgateCompra.value);if(!c||v<=0)return limiteInfo.textContent='';let{data}=await sb.rpc('vc_consultar_limite_resgate',{p_cliente_id:c.id,p_valor_compra:v});if(data?.length)limiteInfo.textContent='Saldo '+money(data[0].saldo_disponivel)+' · limite '+money(data[0].limite_resgate)}async function resgatar(){if(!c)return;let pin=pinCliente.value;if(pin.length!==4)return msgResgate.innerHTML='<div class="msg error">Confirme o PIN de 4 dígitos.</div>';let chk=await sb.rpc('vc_confirmar_pin_cliente',{p_cliente_id:c.id,p_pin:pin});if(chk.error||chk.data!==true)return msgResgate.innerHTML='<div class="msg error">PIN incorreto.</div>';let{data,error}=await sb.rpc('vc_resgatar_cashback',{p_cliente_id:c.id,p_valor_compra:Number(valorResgateCompra.value),p_valor_resgate:Number(valorResgate.value),p_operador:opResgate.value.trim()||'Caixa'});msgResgate.innerHTML=error?'<div class="msg error">'+error.message+'</div>':'<div class="msg ok">Resgatado '+money(data[0].valor_resgatado)+' · novo saldo '+money(data[0].novo_saldo)+'</div>';pinCliente.value='';buscar()}gate();</script></body></html>
