<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110f"><title>Vila Cash · Atualizar Notas</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap');:root{--bg:#07110f;--line:rgba(255,255,255,.11);--green:#83e756;--muted:#9ca8a4}*{box-sizing:border-box}body{margin:0;font-family:Manrope,sans-serif;background:radial-gradient(circle at 50% -10%,#17352a 0,var(--bg) 34%);color:#f5f7f6;min-height:100vh}.app{max-width:700px;margin:auto;padding:20px}.glass{background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px}.brand{font-size:21px;font-weight:800;margin:8px 0 28px}.brand b,.stat b{color:var(--green)}h1{font-size:26px;margin:0 0 7px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.dates label{font-size:12px;color:var(--muted)}input[type=date]{width:100%;margin-top:5px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#101b18;color:#fff;font:inherit}.btn{width:100%;padding:14px;border:0;border-radius:13px;font:inherit;font-weight:800;cursor:pointer;background:var(--green);color:#07110f;margin-top:14px}.btn:disabled{opacity:.55;cursor:wait}.secondary{background:#172521;color:#fff;border:1px solid var(--line)}input[type=file]{display:none}.status{margin-top:14px;padding:13px;border-radius:13px;background:rgba(131,231,86,.08);font-size:13px;line-height:1.5}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.stat{padding:13px;background:rgba(255,255,255,.04);border-radius:12px}.stat b{display:block;font-size:22px}a{color:inherit;text-decoration:none}details summary{cursor:pointer;font-weight:700}@media(max-width:520px){.dates{grid-template-columns:1fr}}</style></head>
<body><main class="app"><div class="brand">VILA <b>CASH</b> <span class="muted">GESTÃO</span></div><div class="glass"><h1>Atualizar notas fiscais</h1><p class="muted">O conector lê as vendas diretamente no relatório da Teknisa e atualiza o Vila Cash. Não é necessário exportar XLS.</p><div class="dates"><label>Data inicial<input id="inicio" type="date"></label><label>Data final<input id="fim" type="date"></label></div><button id="atualizar" class="btn" onclick="solicitar()">Atualizar agora</button><div id="syncStatus" class="status hidden"></div></div>
<div id="resultado" class="glass hidden"><h2 style="margin-top:0">Resultado</h2><div class="stats"><div class="stat"><span class="muted">Linhas lidas</span><b id="rLidas">0</b></div><div class="stat"><span class="muted">Linhas atualizadas</span><b id="rGravadas">0</b></div></div></div>
<details class="glass"><summary>Importar XML manualmente</summary><p class="muted">Use esta opção somente se o conector estiver desligado.</p><input id="arquivos" type="file" accept=".xml,text/xml,application/xml" multiple><button class="btn secondary" onclick="document.getElementById('arquivos').click()">Selecionar XML</button><div id="selecao" class="status hidden"></div><button id="processar" class="btn hidden" onclick="processarXml()">Processar XML</button></details><a href="./"><button class="btn secondary">← Voltar para Gestão</button></a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://bbhtrxuaumhpqtbcgewc.supabase.co','sb_publishable_VO0CBuxqDHhk3n5IwcFjBA_cDwfq0JK'),$=x=>document.getElementById(x);let notas=[],timer=null;const hoje=new Date(),iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');$('inicio').value=$('fim').value=iso(hoje);$('inicio').max=$('fim').max=iso(hoje);
async function exigirSessao(){const{data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Entre primeiro na Gestão Vila Cash com seu usuário administrativo.')}function mostrar(msg){$('syncStatus').textContent=msg;$('syncStatus').classList.remove('hidden')}
async function solicitar(){const b=$('atualizar');b.disabled=true;$('resultado').classList.add('hidden');try{await exigirSessao();const{data,error}=await sb.rpc('vc_gestao_solicitar_sync_teknisa',{p_inicio:$('inicio').value,p_fim:$('fim').value});if(error)throw error;const req=data?.[0];if(!req)throw new Error('A solicitação não foi criada.');mostrar(req.status==='processando'?'O conector já está lendo a Teknisa…':'Solicitação enviada. Aguardando o conector do computador…');acompanhar(req.id)}catch(e){mostrar('Não foi possível iniciar: '+(e.message||'erro desconhecido'));b.disabled=false}}
async function acompanhar(id){clearTimeout(timer);const{data,error}=await sb.rpc('vc_gestao_status_sync_teknisa',{p_id:id});if(error){mostrar('Não foi possível consultar o andamento: '+error.message);$('atualizar').disabled=false;return}const r=data?.[0];if(!r){mostrar('Solicitação não encontrada.');$('atualizar').disabled=false;return}if(r.status==='pendente')mostrar('Aguardando o conector do computador ficar disponível…');else if(r.status==='processando')mostrar(r.mensagem||'Lendo vendas diretamente na Teknisa…');else if(r.status==='concluida'){$('rLidas').textContent=r.vendas_lidas||0;$('rGravadas').textContent=r.vendas_gravadas||0;$('resultado').classList.remove('hidden');mostrar(r.mensagem||'Atualização concluída.');$('atualizar').disabled=false;$('atualizar').textContent='Atualizar novamente';return}else{mostrar('A atualização encontrou um problema: '+(r.mensagem||'erro não informado'));$('atualizar').disabled=false;return}timer=setTimeout(()=>acompanhar(id),3000)}
$('arquivos').addEventListener('change',async e=>{notas=[];let invalidos=0;for(const f of e.target.files){try{const txt=await f.text(),xml=new DOMParser().parseFromString(txt,'application/xml');if(xml.querySelector('parsererror'))throw 0;const inf=xml.querySelector('infNFe'),chave=(inf?.getAttribute('Id')||'').replace(/^NFe/,'').replace(/\D/g,''),cnpj=(xml.querySelector('emit CNPJ')?.textContent||'').replace(/\D/g,''),valor=xml.querySelector('ICMSTot vNF')?.textContent||xml.querySelector('vNF')?.textContent||'';if(chave.length!==44||!valor)throw 0;notas.push({chave,cnpj,valor})}catch(_){invalidos++}}$('selecao').classList.remove('hidden');$('selecao').textContent=notas.length+' NFC-e válida(s)'+(invalidos?' · '+invalidos+' inválida(s)':'')+'.';$('processar').classList.toggle('hidden',!notas.length)});
async function processarXml(){const b=$('processar');b.disabled=true;try{await exigirSessao();const{data,error}=await sb.rpc('vc_gestao_importar_nfce_manual',{p_notas:notas});if(error)throw error;const r=data?.[0]||{};alert('Concluído: '+(r.aprovadas||0)+' cashback(s) validado(s).');b.textContent='XML processado'}catch(e){alert('Não foi possível processar: '+(e.message||'erro desconhecido'));b.disabled=false}}
</script></body></html>
